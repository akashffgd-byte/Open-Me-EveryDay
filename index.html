<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Me Everyday 💌</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      font-family:Arial, sans-serif;
      background:linear-gradient(to bottom,#0f172a,#020617);
      color:white;
      text-align:center;
      padding:20px;
    }

    .stars{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      top:0;
      left:0;
    }

    .star{
      position:absolute;
      width:2px;
      height:2px;
      background:white;
      border-radius:50%;
      animation:twinkle 3s infinite alternate;
    }

    @keyframes twinkle{
      from{
        opacity:0.2;
      }
      to{
        opacity:1;
      }
    }

    .container{
      position:relative;
      z-index:2;
      max-width:500px;
      animation:fadeIn 1.5s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    h1{
      font-size:42px;
      margin-bottom:15px;
    }

    p{
      line-height:1.8;
      opacity:0.85;
      font-size:18px;
    }

    button{
      margin-top:30px;
      padding:15px 28px;
      border:none;
      border-radius:16px;
      background:#ff4d8d;
      color:white;
      font-size:17px;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 0 20px rgba(255,77,141,0.4);
    }

    button:hover{
      transform:scale(1.05);
    }

    .message-box{
      margin-top:30px;
      padding:25px;
      border-radius:20px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      display:none;
      font-size:20px;
      line-height:1.8;
      animation:fadeIn 1s ease;
    }

    .day{
      margin-top:15px;
      opacity:0.6;
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="stars" id="stars"></div>

<div id="passwordScreen" class="container">

<h1>Open Me Everyday 🔐</h1>

<p>
Enter our secret password 💖
</p>

<input
type="password"
id="passwordInput"
placeholder="Password..."
style="
margin-top:20px;
padding:14px;
border:none;
border-radius:12px;
width:220px;
font-size:16px;
text-align:center;
"
/>

<br>

<button onclick="checkPassword()">
Unlock 💌
</button>

<p id="wrongPassword"
style="
margin-top:15px;
color:#ff8fab;
display:none;
">
Wrong password 🥺
</p>

</div>

<div class="container" id="mainContent" style="display:none;">

<h1>Open Me Everyday 💌</h1>

<p>
One message. <br>
Every day. <br>
Until Day 2192 ✨
</p>

<button onclick="showMessage()">
Open Today’s Message
</button>

<div class="message-box" id="messageBox">

<p id="message"></p>

<div class="day" id="dayText"></div>

</div>

</div>

<script>

const PASSWORD = "forever";

let messages = [];

function checkPassword(){

const input =
document.getElementById('passwordInput').value;

if(input === PASSWORD){

document.getElementById('passwordScreen')
.style.display = 'none';

document.getElementById('mainContent')
.style.display = 'block';

}else{

document.getElementById('wrongPassword')
.style.display = 'block';

}

}

async function loadMessages(){

const response = await fetch('messages.txt');

const text = await response.text();

messages = text
.split('\n')
.filter(line => line.trim() !== '');

}

function showMessage(){

const startDate =
new Date('2025-05-23');

const today =
new Date();

const diffTime =
today - startDate;

const currentDay =
Math.floor(
diffTime / (1000 * 60 * 60 * 24)
);

const index =
currentDay % messages.length;

const messageBox =
document.getElementById('messageBox');

const message =
document.getElementById('message');

const dayText =
document.getElementById('dayText');

message.innerText =
messages[index];

dayText.innerText =
'Day ' + (currentDay + 1) + ' 💖';

messageBox.style.display =
'block';

}

loadMessages();

const starsContainer =
document.getElementById('stars');

for(let i=0;i<120;i++){

let star =
document.createElement('div');

star.classList.add('star');

star.style.top =
Math.random()*100 + '%';

star.style.left =
Math.random()*100 + '%';

star.style.animationDuration =
(Math.random()*3 + 2) + 's';

starsContainer.appendChild(star);

}

</script>

</body>

</html>
